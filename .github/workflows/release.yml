name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, args: '--win nsis --x64' }
          - { name: macos-arm64, os: macos-latest, args: '--mac dmg --arm64' }
          # Intel runner so the x64 build gets the x64 ripgrep binary (per-platform optional dependency).
          - { name: macos-x64, os: macos-15-intel, args: '--mac dmg --x64' }
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # unsigned for now (no Apple Developer / code-signing certificate)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Use the tag as the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm pkg set version="${GITHUB_REF_NAME#v}"
      # --ignore-scripts: Desktop Commander's postinstall phones home. Electron's own binary download is
      # run explicitly; @vscode/ripgrep needs no script (binary comes from @vscode/ripgrep-<platform>-<arch>).
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/electron/install.js
      - name: Build panel UI (if present)
        if: hashFiles('ui/package.json') != ''
        shell: bash
        working-directory: ui
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run build
      - run: npm test
      - run: npm run build:electron
      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: neo-commander-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.blockmap
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          files=$(ls artifacts/*.exe artifacts/*.dmg)
          echo "$files"
          gh release create "$GITHUB_REF_NAME" $files --title "Neo Commander ${GITHUB_REF_NAME#v}" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" $files --clobber
